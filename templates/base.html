<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>
        Nivaldo Despachante
    </title>

    <!-- TAILWIND -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- FONT -->
    <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body {

            font-family: 'Inter', sans-serif;
            background: #f8fafc;

        }

    </style>

</head>

<body class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-72 bg-slate-900 text-white flex flex-col shadow-2xl">

        <!-- LOGO -->
        <div class="px-8 py-7 border-b border-slate-800">

            <div class="flex items-center gap-3">

                <div class="w-12 h-12 rounded-2xl bg-gradient-to-r from-blue-600 to-violet-600 flex items-center justify-center text-white text-xl shadow-lg">

                    <i class="fas fa-car-side"></i>

                </div>

                <div>

                    <h1 class="text-xl font-bold">
                        Nivaldo
                    </h1>

                    <p class="text-slate-400 text-sm">
                        Despachante
                    </p>

                </div>

            </div>

        </div>

        <!-- MENU -->
        <nav class="flex-1 p-5 space-y-2">

            <a href="/"
            class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-slate-800 transition-all text-slate-300 hover:text-white">

                <i class="fas fa-chart-line w-5"></i>

                Dashboard

            </a>

            <a href="/clientes"
            class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-slate-800 transition-all text-slate-300 hover:text-white">

                <i class="fas fa-users w-5"></i>

                Clientes

            </a>

            <a href="/veiculos"
            class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-slate-800 transition-all text-slate-300 hover:text-white">

                <i class="fas fa-car w-5"></i>

                Veículos

            </a>

            <a href="/processos"
            class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-slate-800 transition-all text-slate-300 hover:text-white">

                <i class="fas fa-file-invoice w-5"></i>

                Processos

            </a>

            <a href="/ia"
            class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-slate-800 transition-all text-slate-300 hover:text-white">

                <i class="fas fa-robot w-5"></i>

                IA Assistente

            </a>

        </nav>

    </aside>

    <!-- CONTEÚDO -->
    <main class="flex-1 p-10 overflow-y-auto">

        {% block content %}
        {% endblock %}

    </main>

    <!-- JS -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
