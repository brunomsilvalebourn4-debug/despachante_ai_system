{% extends 'base.html' %}

{% block content %}

<div class="max-w-5xl mx-auto">

    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-8">

        <h1 class="text-3xl font-bold text-slate-800 mb-8">
            Editar Cliente
        </h1>

        <form method="POST">

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">

                <div>

                    <label class="block text-sm font-semibold mb-2">
                        Nome
                    </label>

                    <input
                    type="text"
                    name="nome"
                    required
                    value="{{ cliente.nome }}"
                    class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50">

                </div>

                <div>

                    <label class="block text-sm font-semibold mb-2">
                        Telefone
                    </label>

                    <input
                    type="text"
                    name="telefone"
                    required
                    value="{{ cliente.telefone }}"
                    class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50">

                </div>

                <div>

                    <label class="block text-sm font-semibold mb-2">
                        CPF/CNPJ
                    </label>

                    <input
                    type="text"
                    name="cpf"
                    value="{{ cliente.cpf }}"
                    class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50">

                </div>

                <div>

                    <label class="block text-sm font-semibold mb-2">
                        RG
                    </label>

                    <input
                    type="text"
                    name="rg"
                    value="{{ cliente.rg }}"
                    class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50">

                </div>

                <div>

                    <label class="block text-sm font-semibold mb-2">
                        Email
                    </label>

                    <input
                    type="email"
                    name="email"
                    value="{{ cliente.email }}"
                    class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50">

                </div>

                <div>

                    <label class="block text-sm font-semibold mb-2">
                        CEP
                    </label>

                    <input
                    type="text"
                    name="cep"
                    value="{{ cliente.cep }}"
                    class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50">

                </div>

                <div>

                    <label class="block text-sm font-semibold mb-2">
                        Endereço
                    </label>

                    <input
                    type="text"
                    name="endereco"
                    value="{{ cliente.endereco }}"
                    class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50">

                </div>

                <div>

                    <label class="block text-sm font-semibold mb-2">
                        Número
                    </label>

                    <input
                    type="text"
                    name="numero"
                    value="{{ cliente.numero }}"
                    class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50">

                </div>

                <div>

                    <label class="block text-sm font-semibold mb-2">
                        Bairro
                    </label>

                    <input
                    type="text"
                    name="bairro"
                    value="{{ cliente.bairro }}"
                    class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50">

                </div>

                <div>

                    <label class="block text-sm font-semibold mb-2">
                        Cidade
                    </label>

                    <input
                    type="text"
                    name="cidade"
                    value="{{ cliente.cidade }}"
                    class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50">

                </div>

                <div>

                    <label class="block text-sm font-semibold mb-2">
                        Estado
                    </label>

                    <input
                    type="text"
                    name="estado"
                    value="{{ cliente.estado }}"
                    class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50">

                </div>

            </div>

            <div class="flex justify-end mt-8">

                <button
                type="submit"
                class="bg-gradient-to-r from-blue-600 to-violet-600 text-white px-8 py-3 rounded-2xl shadow-lg hover:scale-105 transition-all font-semibold">

                    Salvar Alterações

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
